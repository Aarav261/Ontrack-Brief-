<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Ontracker mark: sparkle-in-a-circle, site accent blue (#4361ee).
       The star and the equatorial split are cut out (transparent) via a mask,
       so the icon sits cleanly on any toolbar background. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <circle cx="64" cy="64" r="47" fill="#fff"/>
      <path d="M64 24 Q64 64 84 64 Q64 64 64 104 Q64 64 44 64 Q64 64 64 24 Z" fill="#000"/>
      <rect x="14" y="62.75" width="100" height="2.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="128" height="128" fill="#4361ee" mask="url(#cut)"/>
</svg>
